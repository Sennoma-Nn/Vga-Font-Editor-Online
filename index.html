<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGA FONT EDITOR ONLINE</title>
    <meta name="description" content="Online VGA bitmap font editor. Edit and create VGA Pixel fonts in your browser.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sennoma-nn.github.io/Vga-Font-Editor-Online/">
    <link rel="shortcut icon" href="imgs/icon.svg">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sennoma-nn.github.io/Vga-Font-Editor-Online/">
    <meta property="og:title" content="VGA FONT EDITOR ONLINE">
    <meta property="og:description" content="Online VGA bitmap font editor. Edit and create VGA Pixel fonts in your browser.">
    <meta property="og:image" content="https://sennoma-nn.github.io/Vga-Font-Editor-Online/imgs/ScreenShot.png">
</head>

<link rel="stylesheet" type="text/css" href="styles/styles.css">

<body>
    <input type="file" id="open-font-input" style="display: none;" />

    <div id="tab-bar" class="tab-bar">
        <div class="tabs" id="tabs"></div>
        <div class="tab-button-dark-gray-bg">
            <button class="menu-button-dark" onclick="addTab()">
                +
            </button>
            <button class="menu-button-dark" onclick="removeTab()">
                -
            </button>
        </div>
    </div>

    <div id="menu-bar" class="menu-bar">
        <div id="menu-bar-button-area" class="menu-bar-button-area"></div>
        <div id="menu-bar-warning-area" class="menu-bar-warning-area"></div>
    </div>

    <div class="editor">
        <div class="char-area" id="char-area">
            <div class="goto" id="goto">
                <button class="menu-button" onclick="gotoInputStart()">
                    <span id="goto-button-text"></span>
                    <span id="string-input"></span>
                </button>
            </div>
            <div class="char-button-area" id="char-button-area"></div>
        </div>

        <div class="canvas-area">
            <div class="char-title" id="char-title"></div>

            <div class="canvars-and-help">
                <div class="pixel-canvas" id="pixel-canvas"></div>
            </div>
        </div>
    </div>

    <div class="preview" id="preview">
        <canvas id="preview-canvas" class="preview-canvas"></canvas>
    </div>
</body>

<script src="scripts/script.js"></script>
<script src="scripts/i18n.js"></script>
<script src="scripts/keyboardShortcut.js"></script>
<script src="scripts/init.js"></script>

</html>
